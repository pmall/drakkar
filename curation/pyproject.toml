[project]
name = "curation"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.5.2",
    "lxml>=6.1.3",
    "olefile>=0.47",
    "openpyxl>=3.1.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "trafilatura>=2.3.1",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "curation"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "ruff>=0.16.10",
    "types-openpyxl>=3.1.5.20260827",
    "xlwt>=1.3.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
