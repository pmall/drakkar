[project]
name = "database"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.88",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pyopal>=0.7.3",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "database"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
